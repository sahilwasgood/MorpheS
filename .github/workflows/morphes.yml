name: MorpheS

"on":
  schedule:
    # Daily, after upstream's translation bot settles
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Release even when upstream has no new commits'
        type: boolean
        default: true
      skip_sync:
        description: 'Skip the upstream rebase (build main as pushed)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-and-release:
    name: Sync upstream and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.MORPHE_S_GPR }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Git identity
        run: |
          git config user.name "sahilwasgood"
          git config user.email "sahilwasgood@users.noreply.github.com"
          git remote add upstream "https://x-access-token:${{ secrets.MORPHE_S_GPR }}@github.com/MorpheApp/morphe-manager.git"

      - name: Sync with upstream dev
        id: sync
        env:
          FORCE: ${{ inputs.force_release }}
          SKIP_SYNC: ${{ inputs.skip_sync }}
        run: |
          set -euo pipefail
          if [ "${SKIP_SYNC:-false}" = "true" ]; then
            echo "skip_sync: building main as pushed, no upstream rebase"
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch upstream dev
          BASE=$(git merge-base HEAD upstream/dev)
          AHEAD=$(git rev-list --count "$BASE"..upstream/dev)

          if [ "$AHEAD" -eq 0 ] && [ "${FORCE:-false}" != "true" ]; then
            echo "No new upstream commits and no forced release. Nothing to do."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Upstream is ${AHEAD} commit(s) ahead; rebasing our commits"
          # Rebase only: origin/main is pushed later, after tests and the build
          # pass, so a broken upstream pin never lands on the fork.
          git rebase upstream/dev
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Stop when nothing to publish
        if: steps.sync.outputs.published != 'true'
        run: exit 0

      - name: Version and suffix
        if: steps.sync.outputs.published == 'true'
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          BASE=$(grep -E '^version' app/gradle.properties | head -1 | sed 's/.*=\s*//')
          # Update weight parses only the last number after the dash, so the fork
          # suffix number must stay above the upstream dev counter forever:
          # weight = dev counter + run number grows monotonically across syncs.
          DEV=$(echo "$BASE" | grep -oE 'dev\.[0-9]+' | cut -d. -f2); DEV=${DEV:-0}
          WEIGHT=$(( DEV + RUN_NUMBER ))
          FULL="${BASE}-s.${WEIGHT}"
          sed -i "s/^version\s*=.*/version = ${FULL}/" app/gradle.properties
          echo "full=${FULL}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "tag=v${FULL}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short upstream/dev 2>/dev/null || echo skip-sync)" >> "$GITHUB_OUTPUT"

      - name: Write keystore
        if: steps.sync.outputs.published == 'true'
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > app/morphes.jks

      - name: Tests and debug APK
        if: steps.sync.outputs.published == 'true'
        env:
          GITHUB_ACTOR: sahilwasgood
          GITHUB_TOKEN: ${{ secrets.MORPHE_S_GPR }}
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug \
            -PmorpheSKeystore=morphes.jks \
            -PmorpheSKeystorePassword="${{ secrets.MORPHE_S_KEYSTORE_PASSWORD }}" \
            -PmorpheSKeystoreAlias=morphes \
            --no-daemon --stacktrace

      - name: Rename APK
        if: steps.sync.outputs.published == 'true'
        run: |
          set -euo pipefail
          mkdir -p apk-out
          SRC=$(find app/build/outputs/apk/debug -name '*-debug.apk' | head -1)
          cp "$SRC" "apk-out/MorpheS-${{ steps.version.outputs.full }}.apk"

      - name: Push rebased main
        if: steps.sync.outputs.published == 'true'
        run: git push --force-with-lease origin main

      - name: Publish GitHub release
        if: steps.sync.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.MORPHE_S_GPR }}
          FULL: ${{ steps.version.outputs.full }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          if [ "$SHA" = "skip-sync" ]; then
            STATE="built from main as pushed; no upstream rebase in this run"
          else
            STATE="synced with upstream Morphe dev at ${SHA}"
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MorpheS ${FULL}" \
            --notes "MorpheS ${FULL}. ${STATE}. Carries our preset thumbnail previews and their cache fix. Upstream notes: https://github.com/MorpheApp/morphe-manager/blob/dev/CHANGELOG.md" \
            "apk-out/MorpheS-${FULL}.apk"
